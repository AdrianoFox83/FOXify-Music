        <span class="marca__nome">FOX<span>ify</span></span>

      <nav class="navegacao">
        <a class="nav-item" data-rota="#/inicio" href="#/inicio"><svg class="icone"><use href="#i-inicio"/></svg><span>Início</span></a>

      </div>

      <a class="nav-item nav-item--config" data-rota="#/config" href="#/config">
        <svg class="icone"><use href="#i-ajustes"/></svg><span>Configurações</span>
      </a>
    </aside>

    <main class="conteudo">
      <header class="topo">
        <form class="busca" data-form="busca-topo" role="search">
          <svg class="icone"><use href="#i-busca"/></svg>
          <input type="search" name="q" id="busca-topo" placeholder="Buscar músicas, artistas, álbuns e playlists..."
            autocomplete="off" enterkeyhint="search" aria-label="Buscar">
        </form>
        <div class="topo__acoes">
          <span class="status-rede" id="status-rede" title="Conexão"><svg class="icone"><use href="#i-wifi"/></svg></span>
          <button class="btn-icone" data-acao="novidades" aria-label="Novidades"><svg class="icone"><use href="#i-sino"/></svg><span class="ponto-notificacao"></span></button>
          <button class="perfil" data-rota="#/config" aria-label="Seu perfil">
            <img src="assets/img/avatar.jpg" alt="" onerror="FOX_IMG_ERRO(this)">
            <svg class="icone icone--pequeno"><use href="#i-seta-baixo"/></svg>
          </button>
        </div>
      </header>

      <header class="topo-mobile">
        <a class="marca marca--mini" href="#/inicio" aria-label="FOXify">
          <img class="marca__logo" src="assets/img/icones/logo-fox.png" alt="">
          <span class="marca__nome">FOX<span>ify</span></span>
        </a>
        <div class="topo-mobile__acoes">
          <button class="btn-icone" data-acao="ir-buscar" aria-label="Buscar"><svg class="icone"><use href="#i-busca"/></svg></button>
          <a class="perfil perfil--mini" href="#/config" aria-label="Ajustes"><img src="assets/img/avatar.jpg" alt="" onerror="FOX_IMG_ERRO(this)"></a>
        </div>
      </header>

      <div id="vista" class="vista" role="main"></div>
    </main>

    <aside class="lateral" id="lateral" aria-label="Tocando agora"></aside>

    <footer class="barra" id="barra" aria-label="Player"></footer>

    <div class="mini" id="mini"></div>

    <nav class="tabbar" id="tabbar" aria-label="Navegação">
      <a class="tabbar__item" data-rota="#/inicio" href="#/inicio"><svg class="icone"><use href="#i-inicio"/></svg><span>Início</span></a>
      <a class="tabbar__item" data-rota="#/buscar" href="#/buscar"><svg class="icone"><use href="#i-busca"/></svg><span>Buscar</span></a>
      <a class="tabbar__item" data-rota="#/suamusica" href="#/suamusica"><svg class="icone"><use href="#i-globo"/></svg><span>Sua música</span></a>
      <a class="tabbar__item" data-rota="#/biblioteca" href="#/biblioteca"><svg class="icone"><use href="#i-biblioteca"/></svg><span>Biblioteca</span></a>
      <a class="tabbar__item" data-rota="#/playlists" href="#/playlists"><svg class="icone"><use href="#i-lista"/></svg><span>Playlists</span></a>
    </nav>

    <section class="sheet" id="sheet" aria-label="Tocando agora">
      <div id="sheet-conteudo" class="sheet__conteudo"></div>
    </section>

    <div class="yt-palco" id="yt-palco" aria-label="Player do YouTube">

        <span>YouTube</span>
        <button class="btn-icone" data-acao="fechar-yt" aria-label="Fechar vídeo">
          <svg class="icone"><use href="#i-fechar"/></svg>
        </button>
      </div>
      <div class="yt-player" id="yt-player"></div>
      <button class="yt-palco__iniciar" data-acao="iniciar-yt">
        <svg class="icone"><use href="#i-play"/></svg> Toque para iniciar o vídeo
      </button>
    </div>

    <div id="modais" class="modais"></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <pre id="diagnostico" hidden></pre>
  </div>
