<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 512px; height: 512px; background: #050b18; overflow: hidden; }
  .icone {
    position: relative; width: 512px; height: 512px; display: grid; place-items: center; overflow: hidden;
    background: radial-gradient(circle at 32% 18%, #1a4687 0%, #0a1a36 42%, #04070f 100%);
  }
  .icone::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(60% 50% at 50% 62%, rgba(47, 123, 255, 0.42), transparent 70%);
  }
  .icone::after {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(115deg, rgba(255,255,255,0.03) 0 2px, transparent 2px 26px);
    opacity: .5;
  }
  .anel {
    position: absolute; width: 78%; height: 78%; border-radius: 50%;
    border: 1px solid rgba(130, 180, 255, 0.22);
    box-shadow: inset 0 0 60px rgba(40, 100, 220, 0.18);
  }
  .anel2 { width: 62%; height: 62%; border-color: rgba(130, 180, 255, 0.12); }
  svg { position: relative; z-index: 2; width: 60%; height: 60%; filter: drop-shadow(0 14px 34px rgba(20, 80, 200, 0.55)); }
  .faisca { position: absolute; border-radius: 50%; background: #9fd2ff; box-shadow: 0 0 12px #5aa2ff; opacity: .8; }
  .f1 { width: 5px; height: 5px; left: 18%; top: 24%; }
  .f2 { width: 3px; height: 3px; right: 20%; top: 18%; }
  .f3 { width: 4px; height: 4px; right: 16%; bottom: 26%; }
</style>
</head>
<body>
  <div class="icone">
    <div class="anel"></div>
    <div class="anel anel2"></div>
    <div class="faisca f1"></div>
    <div class="faisca f2"></div>
    <div class="faisca f3"></div>
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="8" y1="4" x2="40" y2="46" gradientUnits="userSpaceOnUse">
          <stop stop-color="#b6e3ff"/><stop offset=".5" stop-color="#5aa2ff"/><stop offset="1" stop-color="#2456c8"/>
        </linearGradient>
      </defs>
      <path d="M7 4.5 20 12c1.3-.4 2.6-.6 4-.6s2.7.2 4 .6L41 4.5 43 23c-.7 10.5-7.5 17.8-19 22-11.5-4.2-18.3-11.5-19-22Z" fill="url(#g)"/>
      <path d="M17.5 22.5 22 24l-4.5 3z" fill="#061228"/>
      <path d="M30.5 22.5 26 24l4.5 3z" fill="#061228"/>
      <path d="M24 30.5c1.8 0 3.2 1.2 3.2 2.6 0 1.8-1.6 3.4-3.2 4.4-1.6-1-3.2-2.6-3.2-4.4 0-1.4 1.4-2.6 3.2-2.6Z" fill="#061228"/>
    </svg>
  </div>
</body>
</html>
